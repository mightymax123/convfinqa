[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "convfinqa-evaluation-pipeline"
version = "0.1.0"
description = "A data analytics pipeline to assess the capability of modern LLMs to answer a multi turn conversational financial dataset"
requires-python = ">=3.13"
dependencies = [
  "typer==0.12.0",
  "click==8.1.7",
  "tqdm>=4.67.1",
  "loguru>=0.7.0",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.0.0",
  "rich>=13.0.0",
  "pydantic-ai>=0.4",
  "pydantic-ai-slim==1.89.1",
]

[dependency-groups]
dev = [
  "ruff>=0.11.10",
  "pyrefly>=0.17.0",
  "pytest>=8.0.0",
  "coverage>=7.0.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
convfinqa = "app.main:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "F",  # default Ruff rules
    "E",  # pycodestyle Errors
    "W",  # pycodestyle Warnings
    "I",  # import sorting
    "UP", # modern syntax updates
    "B",  # flake8 common pitfalls & best practices
    "Q",  # flake8 consistent quotes
    "N",  # naming conventions
]

ignore = [
    "D101",    # Missing docstring in public class
    "PLR2004", # Magic value used in comparison
    "E501",    # Line too long (formatter can't auto-fix these)
]

extend-select = [
    "PLR2004",
    "D101",
    "D102",
    "D103",
    "D201",
    "D202",
    "D215",
    "T201",
]

[tool.pyrefly]
project-includes = ["app", "tests"]
project-excludes = ["vendor/*", "venv/*", "venvs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["tests/*", "*/tests/*", "*/venv/*", "*/.venv/*"]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
